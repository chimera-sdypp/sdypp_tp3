apiVersion: apps/v1
kind: Deployment
metadata:
  name: ex4-dlq-consumer
  labels:
    app: ex4-dlq-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ex4-dlq-consumer
  template:
    metadata:
      labels:
        app: ex4-dlq-consumer
    spec:
      containers:
        - name: dlq-consumer
          image: sdypp/ex4-app:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "dlq_consumer.py"]
          envFrom:
            - secretRef:
                name: rabbitmq-credenciales
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq-ex4-service"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: QUEUE_NAME
              value: "ex4_task_queue"
            - name: DLX_EXCHANGE
              value: "dlx"
            - name: DLQ_NAME
              value: "dead_letter_queue"
            - name: CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
