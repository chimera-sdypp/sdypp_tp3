x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  QUEUE_NAME: ex4_task_queue
  DLX_EXCHANGE: dlx
  DLQ_NAME: dead_letter_queue

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-ex4
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file: ../.env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5

  # Una sola imagen para los tres procesos (la misma que usan los manifiestos de k8s).
  # Solo `consumer` la construye: si cada servicio tuviera `build`, el builder clásico
  # las construye en paralelo y falla con "image already exists".
  consumer:
    image: sdypp/ex4-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: python consumer.py
    env_file: ../.env
    environment:
      <<: *rabbitmq-env
      FAIL_PROBABILITY: "0.5"
      MAX_RETRIES: "4"
      BASE_DELAY_SECONDS: "1"
      PROCESSING_TIME: "0.2"
    depends_on:
      rabbitmq:
        condition: service_healthy

  dlq-consumer:
    image: sdypp/ex4-app:latest
    pull_policy: never
    command: python dlq_consumer.py
    env_file: ../.env
    environment:
      <<: *rabbitmq-env
    depends_on:
      rabbitmq:
        condition: service_healthy

  producer:
    image: sdypp/ex4-app:latest
    pull_policy: never
    command: python producer.py
    env_file: ../.env
    environment:
      <<: *rabbitmq-env
      NUM_TASKS: "10"
      FORCE_FAIL_EVERY: "5"
      DELAY_BETWEEN_TASKS: "0.1"
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles:
      - producer
