apiVersion: batch/v1
kind: Job
metadata:
  name: ex2-publisher-job
  labels:
    app: ex2-publisher
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: ex2-publisher
    spec:
      restartPolicy: OnFailure
      containers:
        - name: publisher
          image: sdypp/ex2-app:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "publisher.py"]
          envFrom:
            - secretRef:
                name: rabbitmq-credenciales
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq-ex2-service"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: EXCHANGE_NAME
              value: "blockchain_events"
            - name: NUM_BLOCKS
              value: "5"
            - name: DELAY_BETWEEN_BLOCKS
              value: "0.5"
            - name: MINER_ID
              value: "Miner-Node-Alpha"
