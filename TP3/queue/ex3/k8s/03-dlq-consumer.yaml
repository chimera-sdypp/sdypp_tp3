apiVersion: apps/v1
kind: Deployment
metadata:
  name: ex3-dlq-consumer
  labels:
    app: ex3-dlq-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ex3-dlq-consumer
  template:
    metadata:
      labels:
        app: ex3-dlq-consumer
    spec:
      containers:
        - name: dlq-consumer
          image: sdypp/ex3-app:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "dlq_consumer.py"]
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq-ex3-service"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
            - name: QUEUE_NAME
              value: "ex3_task_queue"
            - name: DLX_EXCHANGE
              value: "dlx"
            - name: DLQ_NAME
              value: "dead_letter_queue"
            - name: CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
