# ==============================================================================
# alertrules.yaml — Reglas de Alerta Prometheus para el Sistema Sobel Distribuido
# Hit #4 — Sistemas Distribuidos y Paralelos (Grupo Cerberus - Salva)
# ==============================================================================
# Propósito:
# Este manifiesto declara un recurso personalizado PrometheusRule (Operator CoreOS)
# que define las 4 alertas críticas para la observabilidad y SLOs del cluster:
#   1. SobelColaSaturada: Detecta acumulación anómala en colas AMQP (>50 mensajes).
#   2. SobelWorkerCaido: Detecta degradación total de workers (<1 réplica o caída).
#   3. SobelDLQAgotadosPresentes: Detecta fragmentos derivados a la DLQ final.
#   4. SobelTasaErroresElevada: Detecta violación de SLO por errores 5xx (>5%).
#
# Nota sobre Go Templates:
# Las expresiones '{{ or $labels.queue $labels.cola "desconocida" }}' garantizan que
# si la métrica proviene del exporter nativo de RabbitMQ o de las métricas de negocio
# de Python, nunca se renderice una cadena vacía en Alertmanager.
# ==============================================================================

# API del Operador de Prometheus (CoreOS / Prometheus Community)
apiVersion: monitoring.coreos.com/v1
# Tipo de recurso declarativo para inyección de reglas de alerta y registro
kind: PrometheusRule
metadata:
  # Identificador del conjunto de reglas dentro del cluster
  name: sobel-alert-rules
  # Namespace donde reside el stack de observabilidad y la aplicación
  namespace: sobel
  labels:
    # Etiqueta de pertenencia al sistema distribuido
    app.kubernetes.io/part-of: sobel-distribuido
    # Etiqueta de selección para que la instancia de Prometheus Server cargue la regla
    release: prometheus
    # Rol descriptivo para filtrado kustomize
    role: alert-rules
spec:
  groups:
    # Grupo de alertas relacionadas con el pipeline de procesamiento de imágenes
    - name: sobel.alertas
      rules:
        # ----------------------------------------------------------------------
        # 1. Alerta: Cola de RabbitMQ por encima del umbral de saturación
        # ----------------------------------------------------------------------
        - alert: SobelColaSaturada
          # Expresión PromQL: monitorea tanto el exporter de RabbitMQ como la métrica de negocio
          expr: rabbitmq_queue_messages{queue=~"sobel\\..*"} > 50 or max(sobel_tareas_en_cola) by (cola) > 50
          # Ventana de persistencia: la condición debe mantenerse 1 minuto continuo para no disparar por picos
          for: 1m
          labels:
            severity: warning
            app: sobel
          annotations:
            # Resumen conciso para canales de mensajería (Slack/Discord/Email)
            summary: "Cola {{ or $labels.queue $labels.cola \"desconocida\" }} saturada en RabbitMQ"
            # Detalle técnico explicando el valor actual y el umbral excedido
            description: "La cola {{ or $labels.queue $labels.cola \"desconocida\" }} acumula {{ $value }} mensajes pendientes durante más de 1 minuto, superando el umbral de procesamiento normal (50 mensajes)."

        # ----------------------------------------------------------------------
        # 2. Alerta: Worker que no responde o sin réplicas disponibles
        # ----------------------------------------------------------------------
        - alert: SobelWorkerCaido
          # Expresión PromQL: cruza el estado de réplicas en k8s con el healthcheck 'up' del target de scrape
          expr: |
            (kube_deployment_status_replicas_available{namespace="sobel", deployment=~".*worker"} < 1)
            or
            (up{namespace="sobel", job=~".*worker.*"} == 0)
          # Tiempo breve de persistencia (30s) debido a la criticidad de la caída de workers
          for: 30s
          labels:
            severity: critical
            app: sobel
          annotations:
            summary: "Worker {{ or $labels.deployment $labels.job \"worker\" }} sin réplicas activas o caído"
            description: "El servicio de procesamiento de workers {{ or $labels.deployment $labels.job \"worker\" }} no tiene réplicas disponibles o falló su healthcheck durante más de 30 segundos."

        # ----------------------------------------------------------------------
        # 3. Alerta: Mensajes agotados en la Dead Letter Queue (DLQ)
        # ----------------------------------------------------------------------
        - alert: SobelDLQAgotadosPresentes
          # Expresión PromQL: cualquier mensaje en la cola final requiere intervención
          expr: rabbitmq_queue_messages{queue="sobel.dlq.agotados"} > 0
          for: 1m
          labels:
            severity: warning
            app: sobel
          annotations:
            summary: "Fragmentos acumulados en sobel.dlq.agotados"
            description: "Existen {{ $value }} fragmentos que agotaron sus reintentos máximos y requieren intervención manual de un administrador (/admin/dlq/reprocesar)."

        # ----------------------------------------------------------------------
        # 4. Alerta: Tasa de errores elevada en la API (Violación de SLO)
        # ----------------------------------------------------------------------
        - alert: SobelTasaErroresElevada
          # Expresión PromQL: ratio de respuestas 5xx sobre el total en una ventana móvil de 5 minutos > 5%
          expr: |
            sum(rate(sobel_pedidos_total{codigo=~"5.."}[5m]))
            /
            sum(rate(sobel_pedidos_total[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
            app: sobel
          annotations:
            summary: "Tasa de errores 5xx superior al 5% en Sobel Backend"
            description: "Más del 5% de las solicitudes al backend están respondiendo con error de servidor (5xx) en los últimos 5 minutos."
