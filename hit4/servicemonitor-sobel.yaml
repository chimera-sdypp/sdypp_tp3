apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sobel-services-metrics
  namespace: sobel
  labels:
    app.kubernetes.io/part-of: sobel-distribuido
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - sobel
  selector:
    matchLabels:
      sobel/apps: "true"
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
