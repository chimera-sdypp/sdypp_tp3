apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sobel
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: in-memory-datastore
    sobel/infra: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sobel
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: in-memory-datastore
    sobel/infra: "true"
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: in-memory-datastore
        sobel/infra: "true"
    spec:
      nodeSelector:
        sobel/infra: "true"
      tolerations:
        - key: "sobel/infra"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: REDIS_PASS
            # redis-cli la lee sola: así la clave no queda en los argumentos de las probes
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: REDIS_PASS
          command:
            - sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASS"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
