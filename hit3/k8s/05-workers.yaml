apiVersion: v1
kind: Service
metadata:
  name: sobel-worker
  namespace: sobel
  labels:
    app.kubernetes.io/name: sobel-worker
    app.kubernetes.io/component: worker
    operacion: sobel
    sobel/apps: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: sobel-worker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sobel-worker
  namespace: sobel
  labels:
    app.kubernetes.io/name: sobel-worker
    app.kubernetes.io/component: worker
    operacion: sobel
    sobel/apps: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sobel-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sobel-worker
        app.kubernetes.io/component: worker
        operacion: sobel
        sobel/apps: "true"
    spec:
      nodeSelector:
        sobel/apps: "true"
      tolerations:
        - key: "sobel/apps"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worker
          image: ghcr.io/chimera-sdypp/sobel-worker:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: RABBITMQ_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: REDIS_URL
            - name: SOBEL_PUERTO
              value: "8080"
            - name: SOBEL_OPERACIONES
              value: "sobel"
            - name: SOBEL_IMAGEN
              value: "ghcr.io/chimera-sdypp/sobel-worker:1.0.0"
            - name: SOBEL_TIMEOUT
              value: "60"
            - name: SOBEL_LIMITE_ENTREGAS
              value: "3"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
