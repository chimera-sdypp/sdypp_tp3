apiVersion: v1
kind: Service
metadata:
  name: reasignador
  namespace: sobel
  labels:
    app.kubernetes.io/name: reasignador
    app.kubernetes.io/component: dlq-handler
    pool: apps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reasignador
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reasignador
  namespace: sobel
  labels:
    app.kubernetes.io/name: reasignador
    app.kubernetes.io/component: dlq-handler
    pool: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reasignador
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reasignador
        app.kubernetes.io/component: dlq-handler
        pool: apps
    spec:
      nodeSelector:
        pool: apps
      tolerations:
        - key: "pool"
          operator: "Equal"
          value: "apps"
          effect: "NoSchedule"
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: reasignador
          image: ghcr.io/chimera-sdypp/sobel-reasignador:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: RABBITMQ_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: REDIS_URL
            - name: SOBEL_PUERTO
              value: "8080"
            - name: SOBEL_REINTENTOS_MAX
              value: "3"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
