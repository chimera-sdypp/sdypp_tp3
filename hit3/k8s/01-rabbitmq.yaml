# ==============================================================================
# RabbitMQ 4 Clustereado en Kubernetes (Hit #3) — Alta Disponibilidad (CP)
# ==============================================================================
# Implementa un cluster nativo de 3 réplicas con consenso Raft (Quorum Queues).
# Con 3 nodos, el quorum es 2/3 (mayoría absoluta): tolera la caída de 1 nodo
# sin pérdida de mensajes ni interrupción del servicio.
# ==============================================================================

# 1. Configuración de plugins y parámetros de clustering de RabbitMQ
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: sobel
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
data:
  # Plugins habilitados: gestión web (15672) y métricas para Prometheus (15692)
  enabled_plugins: |
    [rabbitmq_management, rabbitmq_prometheus].

  # Configuración principal de RabbitMQ (formato rabbitmq.conf)
  rabbitmq.conf: |
    ## Backend clásico de descubrimiento de pares (peer discovery sin RBAC complejo)
    cluster_formation.peer_discovery_backend = classic_config
    cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-0.rabbitmq-nodes.sobel.svc.cluster.local
    cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-1.rabbitmq-nodes.sobel.svc.cluster.local
    cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-2.rabbitmq-nodes.sobel.svc.cluster.local

    ## Resolución de particiones de red: autoheal sana particiones reconectando
    cluster_partition_handling = autoheal

    ## Balanceo de líderes de colas quorum entre los 3 nodos del cluster
    queue_leader_locator = balanced
---
# 2. Headless Service para identidad de red y descubrimiento DNS de pods
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-nodes
  namespace: sobel
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
    sobel/infra: "true"
spec:
  type: ClusterIP
  clusterIP: None
  # Permite que CoreDNS resuelva las IPs de los pods aun antes de estar Ready (clave para clustering inicial)
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: epmd
      port: 4369
    - name: dist
      port: 25672
---
# 3. Service ClusterIP balanceador para los clientes (backend, split, worker, joiner)
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: sobel
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
    sobel/infra: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
    - name: prometheus
      port: 15692
      targetPort: 15692
---
# 4. StatefulSet de 3 réplicas en el pool de infraestructura
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: sobel
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
    sobel/infra: "true"
spec:
  serviceName: rabbitmq-nodes
  # Arranque en paralelo para que los 3 nodos puedan descubrirse simultáneamente sin bloquearse
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: message-broker
        sobel/infra: "true"
    spec:
      # Confinamiento estricto en el pool de infraestructura
      nodeSelector:
        sobel/infra: "true"
      tolerations:
        - key: "sobel/infra"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      # Contenedor de inicialización: prepara la cookie de Erlang con permisos estrictos (chmod 400, uid 999)
      initContainers:
        - name: setup-cookie
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo -n "$RABBITMQ_ERLANG_COOKIE" > /var/lib/rabbitmq/.erlang.cookie
              chmod 400 /var/lib/rabbitmq/.erlang.cookie
              chown 999:999 /var/lib/rabbitmq/.erlang.cookie
          env:
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: RABBITMQ_ERLANG_COOKIE
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq

      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
            - name: epmd
              containerPort: 4369
            - name: dist
              containerPort: 25672
          env:
            # Nombre DNS calificado (FQDN) usando el nombre del pod y el headless service
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(HOSTNAME).rabbitmq-nodes.sobel.svc.cluster.local"
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: RABBITMQ_ERLANG_COOKIE
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
  # Volumen persistente independiente para cada réplica (mnesia y logs Raft de quorum queues)
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
