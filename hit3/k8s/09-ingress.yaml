apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sobel-ingress
  namespace: sobel
  labels:
    app.kubernetes.io/name: sobel-ingress
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  rules:
    - http:
        paths:
          # Rutas de la API pública y administrativa expuestas por el backend
          - path: /jobs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /stats
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Todo el resto del tráfico web va al frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
