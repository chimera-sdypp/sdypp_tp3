apiVersion: v1
kind: Service
metadata:
  name: split
  namespace: sobel
  labels:
    app.kubernetes.io/name: split
    app.kubernetes.io/component: image-splitter
    sobel/apps: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: split
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: split
  namespace: sobel
  labels:
    app.kubernetes.io/name: split
    app.kubernetes.io/component: image-splitter
    sobel/apps: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: split
  template:
    metadata:
      labels:
        app.kubernetes.io/name: split
        app.kubernetes.io/component: image-splitter
        sobel/apps: "true"
    spec:
      nodeSelector:
        sobel/apps: "true"
      tolerations:
        - key: "sobel/apps"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: split
          image: ghcr.io/chimera-sdypp/sobel-split:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: RABBITMQ_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: REDIS_URL
            - name: SOBEL_PUERTO
              value: "8080"
            # SOBEL_PARTES: 0 activa el particionado dinámico multivariable (tamaño, workers y colas)
            - name: SOBEL_PARTES
              value: "0"
            - name: SOBEL_LIMITE_ENTREGAS
              value: "3"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
