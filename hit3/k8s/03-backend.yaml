apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sobel
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api-gateway
    pool: apps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sobel
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api-gateway
    pool: apps
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api-gateway
        pool: apps
    spec:
      nodeSelector:
        pool: apps
      tolerations:
        - key: "pool"
          operator: "Equal"
          value: "apps"
          effect: "NoSchedule"
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/chimera-sdypp/sobel-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: RABBITMQ_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: REDIS_URL
            - name: SOBEL_SECRETO
              valueFrom:
                secretKeyRef:
                  name: sobel-secretos
                  key: SOBEL_SECRETO
            - name: SOBEL_PUERTO
              value: "8080"
            - name: SOBEL_TTL
              value: "86400"
            - name: SOBEL_PEDIDOS_POR_MINUTO
              value: "120"
            - name: SOBEL_IMAGENES_PERMITIDAS
              value: "ghcr.io/chimera-sdypp/sobel-worker:1.0.0,ghcr.io/chimera-sdypp/grises-worker:1.0.0,ghcr.io/chimera-sdypp/blur-worker:1.0.0"
            - name: SOBEL_SERVICIOS
              value: "split=http://split:8080/health,joiner=http://joiner:8080/health,reasignador=http://reasignador:8080/health,frontend=http://frontend:8080/health"
            - name: SOBEL_LIMITE_ENTREGAS
              value: "3"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
