# Hit #3 en el GKE compartido (proyecto tp3distribuidos, cluster tp3): namespace propio, un node pool propio
# (pool=chimera, con taint: el otro grupo no lo usa y nosotros no usamos el suyo) y el ingress de GKE, porque no
# hay traefik. El pool se creó con:
#   gcloud container node-pools create chimera --cluster tp3 --zone us-central1-a --machine-type e2-standard-2 \
#     --num-nodes 2 --disk-type pd-standard --disk-size 50 --node-labels pool=chimera --node-taints pool=chimera:NoSchedule
#   kubectl create namespace chimera-sobel
#   SOBEL_NAMESPACE=chimera-sobel GHCR_USER=<usuario> GHCR_PAT=<token read:packages> hit3/k8s/crear_secretos.sh
#   kubectl apply -k hit3/k8s-gke
# Los píxeles van al bucket de Cloud Storage chimera-sobel-imagenes (los objetos vencen al día). Los pods entran con la
# cuenta de servicio de Kubernetes sobel-almacen, por Workload Identity y sin claves. El bucket y el permiso:
#   gcloud storage buckets create gs://chimera-sobel-imagenes --project tp3distribuidos --location us-central1 \
#     --uniform-bucket-level-access --public-access-prevention --lifecycle-file <(echo \
#     '{"rule":[{"action":{"type":"Delete"},"condition":{"age":1}}]}')
#   gcloud storage buckets add-iam-policy-binding gs://chimera-sobel-imagenes --role=roles/storage.objectUser \
#     --member=principal://iam.googleapis.com/projects/914104353770/locations/global/workloadIdentityPools/tp3distribuidos.svc.id.goog/subject/ns/chimera-sobel/sa/sobel-almacen
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chimera-sobel
resources:
  - ../k8s
patches:
  # El bucket es el de Cloud Storage: ni el emulador ni su URL.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: almacen, namespace: sobel}
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: almacen, namespace: sobel}
  - target: {kind: ConfigMap, name: sobel-almacen}
    patch: |-
      - op: replace
        path: /data
        value: {SOBEL_ALMACEN_BUCKET: chimera-sobel-imagenes}
  - target: {kind: Namespace}
    patch: |-
      - op: replace
        path: /metadata/name
        value: chimera-sobel
  - target: {kind: Deployment}
    patch: &nuestros-nodos |-
      - op: replace
        path: /spec/template/spec/nodeSelector
        value: {pool: chimera}
      - op: replace
        path: /spec/template/spec/tolerations
        value: [{key: pool, operator: Equal, value: chimera, effect: NoSchedule}]
  - target: {kind: StatefulSet}
    patch: *nuestros-nodos
  - target: {kind: StatefulSet, name: rabbitmq}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "rabbit@$(HOSTNAME).rabbitmq-nodes.chimera-sobel.svc.cluster.local"
  - target: {kind: ConfigMap, name: rabbitmq-config}
    patch: |-
      - op: replace
        path: /data/rabbitmq.conf
        value: |
          cluster_formation.peer_discovery_backend = classic_config
          cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-0.rabbitmq-nodes.chimera-sobel.svc.cluster.local
          cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-1.rabbitmq-nodes.chimera-sobel.svc.cluster.local
          cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-2.rabbitmq-nodes.chimera-sobel.svc.cluster.local
          cluster_partition_handling = autoheal
          queue_leader_locator = balanced
  - target: {kind: Ingress}
    patch: |-
      - op: replace
        path: /metadata/annotations
        value: {kubernetes.io/ingress.class: gce}
