# El master del Hit #2: recibe los pedidos, los reparte entre los workers y escala las VMs con Terraform.
# Una sola réplica y Recreate: dos escaladores a la vez se pelearían por las VMs. desplegar.sh reemplaza
# __AUDIENCIA_WIF__ por el proveedor de Workload Identity de infra/base y crea el ConfigMap sobel-master-gcp.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sobel-master
  namespace: sobel-hit1
automountServiceAccountToken: false
---
# Las imágenes de los pedidos (las de entrada mientras esperan y los resultados por 10 min): en el disco de la PC,
# no en la RAM de Redis. local-path es el almacenamiento que trae k3s; el volumen sobrevive a los reinicios del pod,
# así no se pierden los pedidos encolados. El master no deja pasar de SOBEL_MAX_DISCO_GB (20) y limpia solo.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sobel-master-datos
  namespace: sobel-hit1
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 25Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sobel-master
  namespace: sobel-hit1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sobel-master
  template:
    metadata:
      labels:
        app: sobel-master
    spec:
      serviceAccountName: sobel-master
      terminationGracePeriodSeconds: 300   # termina el pedido en curso y borra las VMs antes de salir
      containers:
        - name: master
          image: sobel-hit2:local            # importada con `k3s ctr images import` (ver hit2/README.md)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: sobel-hit2-rabbitmq
                  key: RABBITMQ_URL
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SOBEL_LOCALES
              value: sobel-worker:8080
            - name: SOBEL_DATOS
              value: /datos
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/gcp/credenciales.json
          envFrom:
            - configMapRef:
                name: sobel-master-gcp       # TF_VAR_proyecto, TF_VAR_imagen, TF_BUCKET, SOBEL_MAX_VMS…
          volumeMounts:
            - name: datos
              mountPath: /datos
            - name: token-gcp
              mountPath: /var/run/secrets/gcp
              readOnly: true
            - name: credenciales-gcp
              mountPath: /etc/gcp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: sobel-master-datos
        # Token de la ServiceAccount con la audiencia de GCP: el pod lo cambia por credenciales temporales de
        # sobel-ci (Workload Identity). Vence en una hora y kubelet lo renueva solo.
        - name: token-gcp
          projected:
            sources:
              - serviceAccountToken:
                  audience: __AUDIENCIA_WIF__
                  expirationSeconds: 3600
                  path: token
        - name: credenciales-gcp
          configMap:
            name: sobel-master-gcp
            items:
              - key: credenciales.json
                path: credenciales.json
---
# La entrada de los clientes: http://<PC>:30080/pedidos
apiVersion: v1
kind: Service
metadata:
  name: sobel-master
  namespace: sobel-hit1
spec:
  type: NodePort
  selector:
    app: sobel-master
  ports:
    - port: 8080
      nodePort: 30080
